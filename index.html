<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de publicaciones</title>
<style>
:root{--ink:#1b2830;--mut:#5d6c75;--paper:#eef2f1;--card:#fff;--line:#d5dddb;--acc:#0e6b63;--warn:#b3261e;--warnbg:#fdecea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#e6eceb;--mut:#9aaaa6;--paper:#12191c;--card:#1b2428;--line:#2e3b40;--acc:#4fc3b6;--warn:#ff8a80;--warnbg:#3a1f1d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.h-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--paper)}
.sync.ok{color:var(--acc);border-color:var(--acc)}
.sync.err{color:var(--warn);border-color:var(--warn)}
h2{font-size:16px;margin:0 0 8px}
main{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#0b1416}}
button.d{color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;max-width:100%}
textarea{width:100%;min-height:70px}
nav{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--mut)}
nav button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--acc)}
.alert{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.alert b{font-weight:700}
.sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,#888);margin-right:6px}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.bar h2{margin:0;min-width:150px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.filters button.off{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);background:var(--card)}
.wd{padding:6px;font-size:12px;color:var(--mut);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.cell{min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
.cell:hover{background:var(--paper)}
.cell.out{background:var(--paper);opacity:.55}
.cell .n{font-size:12px;color:var(--mut)}
.cell.today .n{background:var(--acc);color:#fff;border-radius:10px;padding:0 6px}
.chip{display:block;margin-top:3px;padding:2px 6px;border-left:4px solid var(--c);background:var(--paper);border-radius:4px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.6;text-decoration:line-through}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.vids{margin:8px 0;padding:0;list-style:none;max-height:170px;overflow:auto;font-size:13px}
.vids li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.tag{font-size:12px;color:var(--mut)}
.tag.ok{color:var(--acc)}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:center}
th:first-child,td:first-child{text-align:left}
.tw{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
label>*{display:block;width:100%;margin-top:3px;color:var(--ink)}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#msg.on{opacity:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card)}
.seg button.on{background:var(--acc);color:#fff}
.tgb{height:64vh;min-height:360px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
.tg{min-width:calc(52px + var(--n)*var(--na)*88px)}
.tgh{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:52px repeat(var(--n),minmax(calc(var(--na)*88px),1fr));background:var(--card);border-bottom:1px solid var(--line)}
.tgc{display:grid;grid-template-columns:52px repeat(var(--n),minmax(calc(var(--na)*88px),1fr))}
.tgd{padding:6px;text-align:center;border-left:1px solid var(--line);font-size:13px}
.tgd.today b{background:var(--acc);color:#fff;border-radius:12px;padding:1px 7px}
.hr,.slot{height:48px}
.hr{font-size:11px;color:var(--mut);text-align:right;padding:0 6px}
.hr:not(:first-child){transform:translateY(-8px)}
.dcol{position:relative;display:flex;border-left:1px solid var(--line)}
.lane{flex:1;min-width:0;position:relative;border-left:1px dashed var(--line)}
.lane:first-child{border-left:0}
.lh{display:flex;margin-top:4px}
.lh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--mut);border-left:1px dashed var(--line);padding:0 2px}
.lh span:first-child{border-left:0}
.lh .dot{width:8px;height:8px;margin-right:3px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.slot{border-bottom:1px solid var(--line);cursor:pointer}
.slot:hover{background:var(--paper)}
.ev{position:absolute;height:44px;padding:2px 6px;border-left:4px solid var(--c);background:var(--paper);outline:1px solid var(--line);border-radius:4px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;z-index:2}
.ev small{color:var(--mut)}
.ev.done{opacity:.6}
.now{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:2;pointer-events:none}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:16px}
.last{list-style:none;margin:0;padding:0;font-size:14px}
.last li{padding:5px 0;border-bottom:1px dashed var(--line)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px}
.donut{display:flex;justify-content:center;padding:6px 0}
.legend{list-style:none;margin:0;padding:0}
.legend li{padding:3px 0}
.pl li{display:flex;justify-content:space-between;gap:10px}
.fld{margin-top:10px}
.fld>span{display:block;font-size:13px}
.fld select,.fld input{width:100%;margin-top:3px}
.combo{position:relative}
.dd{position:absolute;left:0;right:0;top:100%;z-index:20;margin:2px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.dd li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer}
.dd li:hover,.dd li.act{background:var(--paper)}
.dd li.dis{opacity:.55}
.dd li.none{cursor:default;color:var(--mut)}
@media (max-width:640px){.cell{min-height:64px}.chip{font-size:10px;padding:1px 3px}}}
  .donut-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.m-tip{position:fixed;z-index:9999;pointer-events:none;background:#141820;color:#f3f6fa;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.35;box-shadow:0 10px 26px rgba(0,0,0,.42);transform:translate(-50%,-115%);opacity:0;transition:opacity .12s ease;white-space:nowrap}
.m-tip.show{opacity:1}
.m-tip-row{display:flex;align-items:center;gap:7px;font-weight:600}
.m-tip-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.m-tip-sub{color:#9aa6b8;font-size:11.5px;margin-top:2px}
.donut circle[data-seg]{cursor:pointer;transition:opacity .15s ease}
.donut:hover circle[data-seg]:not(:hover){opacity:.65}
.slot-stack{display:block;min-height:48px}
.ev-item{position:relative;min-height:20px;line-height:1.25;padding:2px 6px;border-radius:6px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="h-left">
    <h1>Gestor de publicaciones</h1>
    <span id="sync-status" class="sync">Conectando...</span>
  </div>
  <div class="row" style="margin:0">
    <button data-act="export">Guardar copia</button>
    <button data-act="import">Cargar copia</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>
<main>
  <div id="alerts"></div>
  <nav id="tabs"></nav>
  <section id="view"></section>
</main>

<dialog id="dlg">
  <div id="pf">
    <h2 id="dtitle">Publicación</h2>
    <label>Fecha<input type="date" id="f-date"></label>
    <label>Hora<input type="time" id="f-time"></label>
    <label>Cuenta<select id="f-acc"></select></label>
    <label>Producto<select id="f-prod"></select></label>
    <label>Estado<select id="f-st"><option value="planned">Programada</option><option value="done">Publicada</option></select></label>
    <div class="row" style="margin-top:16px">
      <button type="button" class="p" data-act="savepost">Guardar</button>
      <button type="button" data-act="close">Cancelar</button>
      <button type="button" class="d" id="f-del" data-act="delpost" style="margin-left:auto">Eliminar</button>
    </div>
  </div>
</dialog>
<dialog id="cdlg"><p id="cmsg"></p><div class="row"><button type="button" class="p" data-act="cyes">Sí</button><button type="button" class="button" data-act="cno">No</button></div></dialog>
<div id="msg" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAX8QQnPt8PSGmPNEHelVOTvhgPrv-VETg",
  authDomain: "gestor-de-publicaciones-tiktok.firebaseapp.com",
  projectId: "gestor-de-publicaciones-tiktok",
  storageBucket: "gestor-de-publicaciones-tiktok.firebasestorage.app",
  messagingSenderId: "250424920614",
  appId: "1:250424920614:web:c339e1b7027a53781a34e7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const cloudDoc = doc(db, "gestor_app", "estado_principal");

const KEY='gestor-publicaciones-v1';
const COLORS=['#0e6b63','#c2410c','#2563eb','#9333ea','#ca8a04','#db2777','#4d7c0f','#0891b2'];
let S={accounts:[],products:[],posts:[],thr:3};
let cloudReady=false, applyingRemote=false, cloudErr='';

const norm=()=>{
  if(!Array.isArray(S.accounts))S.accounts=[];
  if(!Array.isArray(S.products))S.products=[];
  if(!Array.isArray(S.posts))S.posts=[];
  S.products.forEach(p=>{
    if(p.stock===undefined){
      const base=p.total!==undefined?p.total:(p.videos||[]).length;
      p.stock=Math.max(0,base-S.posts.filter(x=>x.productId==p.id).length);
      delete p.total;delete p.videos;
    }
  });
  S.posts.forEach(x=>{if(!x.time)x.time='09:00'});
};

try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.products)S=Object.assign(S,r)}catch(e){}
norm();

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const acc=id=>S.accounts.find(a=>a.id==id), prod=id=>S.products.find(p=>p.id==id);
let storageOK=true;try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
let mt;function toast(t){const m=$('#msg');m.textContent=t;m.classList.add('on');clearTimeout(mt);mt=setTimeout(()=>m.classList.remove('on'),2200)}
function ask(msg,fn){$('#cmsg').textContent=msg;ask.fn=fn;$('#cdlg').showModal()}

function setSyncUI(state,text){
  const el=$('#sync-status');if(!el)return;
  el.className='sync'+(state?' '+state:'');
  el.textContent=text;
}

function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

async function pushCloud(){
  saveLocal();
  if(applyingRemote)return;
  setSyncUI('','Guardando...');
  try{
    const snap=await getDoc(cloudDoc);
    const remote=snap.exists()?snap.data():null;
    const deletedIds=Array.from(new Set([
      ...(Array.isArray(remote?.deletedIds)?remote.deletedIds:[]),
      ...(Array.isArray(S.deletedIds)?S.deletedIds:[])
    ]));
    const deletedSet=new Set(deletedIds);
    const byId=(a=[],b=[])=>{
      const m=new Map();
      (Array.isArray(a)?a:[]).forEach(x=>{if(x&&x.id!=null&&!deletedSet.has(x.id))m.set(x.id,x);});
      (Array.isArray(b)?b:[]).forEach(x=>{if(x&&x.id!=null&&!deletedSet.has(x.id))m.set(x.id,{...(m.get(x.id)||{}),...x});});
      return [...m.values()];
    };
    const merged={
      ...(remote||{}),
      ...JSON.parse(JSON.stringify(S)),
      deletedIds,
      accounts:byId(remote?.accounts,S.accounts),
      products:byId(remote?.products,S.products),
      posts:byId(remote?.posts,S.posts)
    };
    S=Object.assign({accounts:[],products:[],posts:[],thr:3},merged);
    norm();
    saveLocal();
    await setDoc(cloudDoc,JSON.parse(JSON.stringify(S)),{merge:true});
    cloudErr='';
    setSyncUI('ok','Sincronizado');
  }catch(e){
    cloudErr=e.message||String(e);
    setSyncUI('err','Error de nube');
  }
}

const save=()=>{pushCloud()};

let tab='cal', cur=new Date(); let cv=S.cv||'month',tgScroll=7*48-8,editProd=null,recPick=null,recAcc=null,recSkip=0,recDate=null,recTime=null; const hidden=new Set(); let editing=null;

const free=p=>Math.max(0,p.stock||0);
const count=(pid,aid,st)=>S.posts.filter(x=>x.productId==pid&&(!aid||x.accountId==aid)&&(!st||x.status==st)).length;
const last=(pid,aid)=>S.posts.filter(x=>x.productId==pid&&x.accountId==aid&&x.status=='done').map(x=>x.date).sort().pop()||'';
const lastDT=pid=>S.posts.filter(x=>x.productId==pid).map(x=>x.date+' '+(x.time||'00:00')).sort().pop()||'';
const curSug=()=>{const l=suggest();return l.length?l[recSkip%l.length].p:null};
function suggest(){
  return S.products.filter(p=>free(p)>0).map(p=>({p,l:lastDT(p.id),n:count(p.id)})).sort((a,b)=>a.l.localeCompare(b.l)||a.n-b.n);
}
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('es',{day:'numeric',month:'short'}):'';

function render(){
  const errAlert=cloudErr?`<div class="alert"><b>Sin sincronizar con Firebase:</b> ${esc(cloudErr)}. Verifica que Firestore esté creado en modo de prueba o revisa las reglas de Firestore.</div>`:'';
  const prevAlert=(storageOK?'':`<div class="alert"><b>Los datos no se guardarán localmente.</b> Abre el archivo en tu navegador o súbelo a un enlace web para guardar.</div>`);
  $('#alerts').innerHTML=errAlert+prevAlert;
  const T=[['cal','Calendario'],['prod','Productos'],['vid','Resumen de videos'],['acc','Cuentas'],['sum','Resumen']];
  $('#tabs').innerHTML=T.map(t=>`<button data-act="tab" data-t="${t[0]}" class="${tab==t[0]?'on':''}">${t[1]}</button>`).join('');
  $('#view').innerHTML={cal:vCal,prod:vProd,vid:vVid,acc:vAcc,sum:vSum}[tab]();
  const si=$('#stock-in');if(si){si.focus();si.select()}
  const g=$('#tgb');if(g){g.scrollTop=tgScroll;g.onscroll=()=>{tgScroll=g.scrollTop}}
}

function vCal(){
  if(!S.accounts.length||!S.products.length)return `<div class="box">Para empezar, crea al menos una <b>cuenta</b> y un <b>producto</b> con sus videos en las otras pestañas (o carga tu copia <b>.json</b> arriba a la derecha).</div>`;
  const td=ymd(new Date()),cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  const Y=cur.getFullYear(),M=cur.getMonth(),D=cur.getDate();
  const byTime=(a,b)=>(a.time||'').localeCompare(b.time||'');
  let body,title;
  if(cv=='month'){
    const off=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate(),tot=Math.ceil((off+dim)/7)*7;
    let cells='';
    for(let i=0;i<tot;i++){
      const d=new Date(Y,M,i-off+1),k=ymd(d);
      const ps=S.posts.filter(x=>x.date==k&&!hidden.has(x.accountId)).sort(byTime);
      cells+=`<div class="cell ${d.getMonth()!=M?'out':''} ${k==td?'today':''}" data-act="new" data-date="${k}"><span class="n">${d.getDate()}</span>${ps.map(x=>`<span class="chip ${x.status}" data-act="edit" data-id="${x.id}" style="--c:${acc(x.accountId)?.color||'#888'}" title="${esc(prod(x.productId)?.name||'')}">${esc(x.time||'')} ${esc(prod(x.productId)?.name||'?')}</span>`).join('')}</div>`;
    }
    body=`<div class="grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>`;
    title=cap(cur.toLocaleDateString('es',{month:'long',year:'numeric'}));
  }else{
    const st=cv=='day'?new Date(Y,M,D):new Date(Y,M,D-((new Date(Y,M,D).getDay()+6)%7));
    const days=Array.from({length:cv=='day'?1:7},(_,i)=>new Date(st.getFullYear(),st.getMonth(),st.getDate()+i));
    body=timeGrid(days,td,byTime);
    title=cv=='day'?cap(cur.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})):days[0].toLocaleDateString('es',{day:'numeric',month:'short'})+' – '+days[6].toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'});
  }
  return `${recBox()}
  <div class="bar"><button data-act="mon" data-d="-1" aria-label="Anterior">‹</button><h2>${title}</h2><button data-act="mon" data-d="1" aria-label="Siguiente">›</button><button data-act="mon" data-d="0">Hoy</button>
  <div class="seg">${[['day','Día'],['week','Semana'],['month','Mes']].map(v=>`<button data-act="cv" data-v="${v[0]}" class="${cv==v[0]?'on':''}">${v[1]}</button>`).join('')}</div>
  <div class="filters">${S.accounts.map(a=>`<button class="${hidden.has(a.id)?'off':''}" data-act="filt" data-id="${a.id}"><span class="dot" style="--c:${a.color}"></span>${esc(a.name)}</button>`).join('')}</div></div>
  ${body}
  <p class="mut">${cv=='month'?'Toca un día para programar.':'Cada columna es una cuenta. Toca una hora vacía para programar en esa cuenta y a esa hora.'} Toca una publicación para marcarla como publicada, cambiarla de día u hora, o eliminarla.</p>`;
}

function timeGrid(days,td,byTime){
  const HH=48,n=days.length,now=new Date(),vis=S.accounts.filter(a=>!hidden.has(a.id)),na=Math.max(1,vis.length);
  const mins=t=>{const q=t.split(':').map(Number);return q[0]*60+q[1]};
  const lh=vis.map(a=>`<span title="${esc(a.name)}"><i class="dot" style="--c:${a.color}"></i>${esc(a.name)}</span>`).join('');
  let h=`<div class="tgb" id="tgb"><div class="tg" style="--n:${n};--na:${na}"><div class="tgh"><div></div>${days.map(d=>`<div class="tgd ${ymd(d)==td?'today':''}">${d.toLocaleDateString('es',{weekday:'short'})} <b>${d.getDate()}</b><div class="lh">${lh}</div></div>`).join('')}</div><div class="tgc"><div>${Array.from({length:24},(_,i)=>`<div class="hr">${String(i).padStart(2,'0')}:00</div>`).join('')}</div>`;
  days.forEach(d=>{
    const k=ymd(d);
    h+='<div class="dcol">';
    vis.forEach(a=>{
      const ps=S.posts.filter(x=>x.date===k&&x.accountId===a.id).sort(byTime),ends=[];
      const pl=ps.map(x=>{const m=mins(x.time||'09:00');let j=ends.findIndex(e=>e<=m);if(j<0){j=ends.length;ends.push(0)}ends[j]=m+55;return {x,m,j}});
      const K=Math.max(1,ends.length);
      h+='<div class="lane">'+Array.from({length:24},(_,i)=>`<div class="slot" data-act="new" data-date="${k}" data-time="${String(i).padStart(2,'0')}:00" data-acc="${a.id}"></div>`).join('');
      pl.forEach(o=>{const x=o.x,t=x.time||'09:00',nm=prod(x.productId)?.name||'?';
        h+=`<span class="ev ${x.status}" data-act="edit" data-id="${x.id}" title="${esc(t+' '+nm+' ('+a.name+')')}" style="--c:${a.color};top:${o.m/60*HH}px;left:${o.j/K*100}%;width:calc(${100/K}% - 8px)"><b>${esc(t)}</b> ${esc(nm)}</span>`});
      h+='</div>';
    });
    if(k==td)h+=`<div class="now" style="top:${(now.getHours()+now.getMinutes()/60)*HH}px"></div>`;
    h+='</div>';
  });
  return h+'</div></div></div>';
}

const band=n=>n>=21?'g':n>=6?'y':'r';
const BC={g:'#2e9e5b',y:'#e0a800',r:'#d64541'};
function vVid(){
  if(!S.products.length)return `<div class="box">Agrega productos en la pestaña Productos para ver aquí su resumen de videos.</div>`;
  const N=S.products.length,cnt={g:0,y:0,r:0};
  S.products.forEach(p=>cnt[band(free(p))]++);
  const need=S.products.filter(p=>band(free(p))!='g').sort((a,b)=>free(a)-free(b));
  const R=70,C=2*Math.PI*R;let off=0;
  const BL={r:'Sin videos / críticos (<6)',y:'Por grabar pronto (6–20)',g:'Stock suficiente (21+)'};
const segs=['r','y','g'].filter(k=>cnt[k]).map(k=>{const len=cnt[k]/N*C,pct=Math.round(cnt[k]/N*100),el=`<circle cx="90" cy="90" r="${R}" fill="none" stroke="${BC[k]}" stroke-width="34" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)" data-seg="${k}" data-label="${BL[k]}" data-cnt="${cnt[k]}" data-pct="${pct}"></circle>`;off+=len;return el;}).join('');
  const por=`<div class="box"><h2>Videos por grabar</h2>${need.length?`<ul class="last">${need.map(p=>{const n=free(p);return `<li><span class="dot" style="--c:${BC[band(n)]}"></span><b>${esc(p.name)}</b><div class="mut">${n==0?'Sin videos disponibles':'Quedan '+n+(n==1?' video':' videos')}. ${band(n)=='r'?'Grabar ya.':'Grabar pronto.'}</div></li>`}).join('')}</ul>`:'<div class="mut">Todos tus productos tienen 21 videos o más. No hay nada por grabar.</div>'}</div>`;
  const chart=`<div class="box"><h2>Semáforo de videos</h2><div class="donut"><svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Productos por semáforo: ${cnt.g} verdes, ${cnt.y} amarillos, ${cnt.r} rojos"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line)" stroke-width="34"/>${segs}<text x="90" y="92" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${N}</text><text x="90" y="110" text-anchor="middle" font-size="12" fill="var(--mut)">${N==1?'producto':'productos'}</text></svg></div></div>`;

const nrm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function updRec(){const b=$('#rec-go');if(!b)return;const t=(recPick&&prod(recPick))||curSug();b.disabled=!t||!S.accounts.length;b.textContent=t?'Programar '+t.name:'Programar'}

document.addEventListener('input',e=>{
  if(e.target.id!='rec-q')return;
  if(recPick){const pk=prod(recPick);if(!pk||nrm(pk.name)!=nrm(e.target.value))recPick=null}

document.addEventListener('click',e=>{if(!e.target.closest('.combo')){const ul=$('#rec-list');if(ul)ul.hidden=true}});
document.addEventListener('keydown',e=>{
  if(e.target.id!='rec-q')return;
  const ul=$('#rec-list');
  if(e.key=='Escape'){ul.hidden=true;return}
  if(e.key=='ArrowDown'||e.key=='ArrowUp'){
    e.preventDefault();if(ul.hidden)showList();
    const it=[...ul.querySelectorAll('li[data-id]')];if(!it.length)return;
    let i=it.findIndex(x=>x.classList.contains('act'));it.forEach(x=>x.classList.remove('act'));
    i=e.key=='ArrowDown'?(i+1)%it.length:(i<=0?it.length-1:i-1);
    it[i].classList.add('act');it[i].scrollIntoView({block:'nearest'});
  }else if(e.key=='Enter'){
    e.preventDefault();
    if(ul.hidden){$('#rec-go').click();return}
    const it=[...ul.querySelectorAll('li[data-id]')],a=it.find(x=>x.classList.contains('act'))||it.find(x=>!x.classList.contains('dis'))||it[0];
    if(a)a.click();
  }
});

let needRender=false;
function autoPublish(){
  const now=Date.now(),hechas=[];
  S.posts.forEach(x=>{if(x.status=='planned'&&new Date(x.date+'T'+(x.time||'00:00')).getTime()<=now){x.status='done';hechas.push(x)}});
  if(hechas.length){saveLocal();if(cloudReady)pushCloud();needRender=true;toast(hechas.length==1?'Se publicó: '+(prod(hechas[0].productId)?.name||'publicación'):hechas.length+' publicaciones pasaron a Publicada')}
  const ae=document.activeElement,busy=$('#dlg').open||$('#cdlg').open||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
  if(needRender&&!busy){needRender=false;render()}
}
setInterval(autoPublish,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoPublish()});

onSnapshot(cloudDoc, snap => {
  cloudReady=true;
  cloudErr='';
  if(snap.exists()){
    const remote=snap.data();
    if(remote && Array.isArray(remote.products) && Array.isArray(remote.accounts) && Array.isArray(remote.posts)){
applyingRemote=true;
    const deletedIds=Array.from(new Set([
        ...(Array.isArray(S.deletedIds)?S.deletedIds:[]),
        ...(Array.isArray(remote.deletedIds)?remote.deletedIds:[])
      ]));
      const deletedSet=new Set(deletedIds);
      const mergeArr=(localArr=[],remArr=[])=>{
        const map=new Map();
        (Array.isArray(localArr)?localArr:[]).forEach(item=>{if(item&&item.id!=null&&!deletedSet.has(item.id))map.set(item.id,item);});
        (Array.isArray(remArr)?remArr:[]).forEach(item=>{if(item&&item.id!=null&&!deletedSet.has(item.id))map.set(item.id,{...(map.get(item.id)||{}),...item});});
        return [...map.values()];
      };
      S=Object.assign({accounts:[],products:[],posts:[],deletedIds:[],thr:3},S,remote,{
        deletedIds,
        accounts:mergeArr(S.accounts,remote.accounts),
        products:mergeArr(S.products,remote.products),
        posts:mergeArr(S.posts,remote.posts)
      });
      norm();
      saveLocal();
      const ae=document.activeElement,busy=$('#dlg').open||$('#cdlg').open||(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
      if(!busy)render();
      applyingRemote=false;
    }
  }else if(S.accounts.length || S.products.length || S.posts.length){
    pushCloud();
  }
  setSyncUI('ok','Sincronizado');
}, err => {
  cloudErr=err.message||String(err);
  setSyncUI('err','Error de nube');
  render();
});

  });
  document.addEventListener('touchstart',e=>{
    const seg=e.target.closest('.donut circle[data-seg]');
    if(seg)moveTip(e,seg);
    else tip.classList.remove('show');
  },{passive:true});
})();
</script>
</body>
